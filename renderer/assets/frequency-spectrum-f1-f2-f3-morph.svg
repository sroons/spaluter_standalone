<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Frequency spectrum with F1 F2 F3 bands</title>
  <desc id="desc">Animated frequency spectrum with highlighted formant bands F1, F2, and F3, morphing between cool and warm tone colors.</desc>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgb(15,15,25)" />
      <stop offset="50%" stop-color="rgb(28,45,74)" />
      <stop offset="100%" stop-color="rgb(15,15,25)" />
    </linearGradient>

    <linearGradient id="spectrumFill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgb(91,169,246)">
        <animate attributeName="stop-color" dur="7s" repeatCount="indefinite" values="rgb(91,169,246);rgb(114,213,142);rgb(235,110,79);rgb(91,169,246)" />
      </stop>
      <stop offset="55%" stop-color="rgb(114,213,142)">
        <animate attributeName="stop-color" dur="7s" repeatCount="indefinite" values="rgb(114,213,142);rgb(199,146,234);rgb(235,110,79);rgb(114,213,142)" />
      </stop>
      <stop offset="100%" stop-color="rgb(235,110,79)">
        <animate attributeName="stop-color" dur="7s" repeatCount="indefinite" values="rgb(235,110,79);rgb(91,169,246);rgb(199,146,234);rgb(235,110,79)" />
      </stop>
    </linearGradient>

    <filter id="glow" x="-20%" y="-120%" width="140%" height="340%">
      <feGaussianBlur stdDeviation="3.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .frame {
      fill: none;
      stroke: rgba(52,55,84,0.9);
      stroke-width: 2;
    }

    .panel {
      fill: rgba(18,22,38,0.82);
      stroke: rgba(52,55,84,0.86);
      stroke-width: 1.5;
    }

    .title {
      fill: rgb(232,238,255);
      font-family: "DM Sans", Inter, system-ui, sans-serif;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .sub {
      fill: rgb(169,180,208);
      font-family: "DM Sans", Inter, system-ui, sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.25px;
      text-transform: uppercase;
    }

    .axis {
      stroke: rgba(169,180,208,0.3);
      stroke-width: 1.4;
      stroke-linecap: round;
    }

    .grid {
      stroke: rgba(169,180,208,0.1);
      stroke-width: 1;
    }

    .tick {
      fill: rgb(169,180,208);
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
    }

    .band {
      stroke-width: 1.2;
      stroke-dasharray: 6 6;
      animation: pulse 2.1s ease-in-out infinite alternate;
    }

    .f1 { fill: rgba(91,169,246,0.14); stroke: rgba(91,169,246,0.9); }
    .f2 { fill: rgba(114,213,142,0.14); stroke: rgba(114,213,142,0.9); animation-delay: 0.35s; }
    .f3 { fill: rgba(235,110,79,0.14); stroke: rgba(235,110,79,0.9); animation-delay: 0.7s; }

    .band-label {
      font-family: "DM Sans", Inter, system-ui, sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .band-label.f1 { fill: rgb(91,169,246); }
    .band-label.f2 { fill: rgb(114,213,142); }
    .band-label.f3 { fill: rgb(235,110,79); }

    .bar {
      fill: url(#spectrumFill);
      filter: url(#glow);
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: sway 2.8s ease-in-out infinite;
    }

    .trace {
      fill: none;
      stroke: url(#spectrumFill);
      stroke-width: 2.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 12 8;
      filter: url(#glow);
      animation: flow 2.4s linear infinite;
    }

    @keyframes pulse {
      from { opacity: 0.62; }
      to { opacity: 1; }
    }

    @keyframes sway {
      0%, 100% { transform: scaleY(0.95); }
      50% { transform: scaleY(1.05); }
    }

    @keyframes flow {
      to { stroke-dashoffset: -120; }
    }
  </style>

  <rect width="1200" height="420" fill="url(#bg)" />
  <rect class="frame" x="14" y="14" width="1172" height="392" rx="18" />

  <text class="title" x="600" y="56" text-anchor="middle">Frequency Spectrum</text>
  <text class="sub" x="600" y="78" text-anchor="middle">Highlighted formant bands and tone-color morph</text>

  <rect class="panel" x="56" y="96" width="1088" height="272" rx="12" />

  <path class="grid" d="M86 146 H1114 M86 196 H1114 M86 246 H1114 M86 296 H1114" />
  <path class="axis" d="M86 336 H1114" />
  <path class="axis" d="M86 126 V336" />

  <!-- Frequency ticks -->
  <text class="tick" x="84" y="352">0 Hz</text>
  <text class="tick" x="286" y="352">500</text>
  <text class="tick" x="488" y="352">1000</text>
  <text class="tick" x="690" y="352">2000</text>
  <text class="tick" x="892" y="352">3000</text>
  <text class="tick" x="1080" y="352">4000+</text>

  <!-- Formant bands -->
  <rect class="band f1" x="202" y="118" width="96" height="226" rx="8" />
  <rect class="band f2" x="450" y="118" width="120" height="226" rx="8" />
  <rect class="band f3" x="778" y="118" width="146" height="226" rx="8" />

  <text class="band-label f1" x="250" y="112" text-anchor="middle">F1</text>
  <text class="band-label f2" x="510" y="112" text-anchor="middle">F2</text>
  <text class="band-label f3" x="851" y="112" text-anchor="middle">F3</text>

  <!-- Bars -->
  <g>
    <rect class="bar" x="118" y="274" width="18" height="62" style="animation-delay:0s" />
    <rect class="bar" x="144" y="262" width="18" height="74" style="animation-delay:0.1s" />
    <rect class="bar" x="170" y="246" width="18" height="90" style="animation-delay:0.2s" />
    <rect class="bar" x="196" y="210" width="18" height="126" style="animation-delay:0.3s" />
    <rect class="bar" x="222" y="188" width="18" height="148" style="animation-delay:0.4s" />
    <rect class="bar" x="248" y="202" width="18" height="134" style="animation-delay:0.5s" />
    <rect class="bar" x="274" y="228" width="18" height="108" style="animation-delay:0.6s" />
    <rect class="bar" x="300" y="252" width="18" height="84" style="animation-delay:0.7s" />
    <rect class="bar" x="326" y="270" width="18" height="66" style="animation-delay:0.8s" />

    <rect class="bar" x="374" y="262" width="18" height="74" style="animation-delay:0.2s" />
    <rect class="bar" x="400" y="238" width="18" height="98" style="animation-delay:0.3s" />
    <rect class="bar" x="426" y="208" width="18" height="128" style="animation-delay:0.4s" />
    <rect class="bar" x="452" y="170" width="18" height="166" style="animation-delay:0.5s" />
    <rect class="bar" x="478" y="154" width="18" height="182" style="animation-delay:0.6s" />
    <rect class="bar" x="504" y="164" width="18" height="172" style="animation-delay:0.7s" />
    <rect class="bar" x="530" y="196" width="18" height="140" style="animation-delay:0.8s" />
    <rect class="bar" x="556" y="230" width="18" height="106" style="animation-delay:0.9s" />
    <rect class="bar" x="582" y="258" width="18" height="78" style="animation-delay:1s" />

    <rect class="bar" x="630" y="266" width="18" height="70" style="animation-delay:0.4s" />
    <rect class="bar" x="656" y="252" width="18" height="84" style="animation-delay:0.5s" />
    <rect class="bar" x="682" y="236" width="18" height="100" style="animation-delay:0.6s" />
    <rect class="bar" x="708" y="222" width="18" height="114" style="animation-delay:0.7s" />
    <rect class="bar" x="734" y="208" width="18" height="128" style="animation-delay:0.8s" />
    <rect class="bar" x="760" y="194" width="18" height="142" style="animation-delay:0.9s" />
    <rect class="bar" x="786" y="180" width="18" height="156" style="animation-delay:1s" />
    <rect class="bar" x="812" y="166" width="18" height="170" style="animation-delay:1.1s" />
    <rect class="bar" x="838" y="172" width="18" height="164" style="animation-delay:1.2s" />
    <rect class="bar" x="864" y="194" width="18" height="142" style="animation-delay:1.3s" />
    <rect class="bar" x="890" y="220" width="18" height="116" style="animation-delay:1.4s" />
    <rect class="bar" x="916" y="246" width="18" height="90" style="animation-delay:1.5s" />

    <rect class="bar" x="964" y="268" width="18" height="68" style="animation-delay:0.9s" />
    <rect class="bar" x="990" y="276" width="18" height="60" style="animation-delay:1s" />
    <rect class="bar" x="1016" y="284" width="18" height="52" style="animation-delay:1.1s" />
    <rect class="bar" x="1042" y="292" width="18" height="44" style="animation-delay:1.2s" />
    <rect class="bar" x="1068" y="300" width="18" height="36" style="animation-delay:1.3s" />
  </g>

  <path class="trace" d="M127 274 L153 262 L179 246 L205 210 L231 188 L257 202 L283 228 L309 252 L335 270 L383 262 L409 238 L435 208 L461 170 L487 154 L513 164 L539 196 L565 230 L591 258 L639 266 L665 252 L691 236 L717 222 L743 208 L769 194 L795 180 L821 166 L847 172 L873 194 L899 220 L925 246 L973 268 L999 276 L1025 284 L1051 292 L1077 300" />
</svg>
