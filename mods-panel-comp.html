<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mods Panel Proposal</title>
<style>
/* Base aesthetics copied directly from styles.css */
@font-face { font-family:"DINCond"; src:local("DIN Condensed Bold"); font-weight:700; }
@font-face { font-family:"DINAlt"; src:local("DIN Alternate Bold"); font-weight:700; }

:root{
  --ink:#0b0b0d; --ink-2:#131318; --ink-3:#1b1b22;
  --paper:#e9e3d6; --paper-2:#d8d1c0; --paper-ink:#16120b;
  --mute:#74737e; --mute-2:#9a99a4;
  --line:rgba(233,227,214,.10); --line-2:rgba(233,227,214,.18);
  --shock:#ff6f24; --shock-dim:#c2531a;
  --ice:#cfe6ff; --acid:#1f8bff; --ok:#8fe39b; --warn:#ffd23a; --red:#ff5a5f;
  --mono:"Andale Mono","Menlo",monospace;
  --din:"DINAlt","DIN Alternate",sans-serif;
  --dinc:"DINCond","DIN Condensed",Impact,sans-serif;
}

*{ box-sizing:border-box; margin:0; padding:0;
  font-family:"Helvetica Neue",Arial,sans-serif; }

body{
  background:radial-gradient(120% 90% at 78% -10%, #17171d 0%, var(--ink) 55%), var(--ink);
  color:var(--paper); -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column; user-select:none;
  padding: 20px;
  height: 100vh;
}

/* Modbar */
.modbar{ flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
  padding:10px 12px; background:var(--ink-2); border:1px solid var(--line-2); gap:10px; margin-bottom: 12px;}
.modbar-title{ font-family:var(--din); font-weight:700; font-size:15px; text-transform:uppercase;
  letter-spacing:.04em; color:var(--paper); }
.modbar-title b{ color:var(--shock); }
.modbar-meta{ font-family:var(--mono); font-size:11px; color:var(--mute-2); letter-spacing:.04em; }

/* Grid */
.lfo-card-grid{ flex:1; overflow-y:auto; display:grid; grid-auto-rows:max-content;
  grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; align-content:start; padding-bottom: 20px;}

/* Proposed Card Design */
.lfo-card{ position:relative; overflow:hidden; background:var(--ink-2);
  border:1px solid var(--line-2); border-left:4px solid var(--lfo-accent,var(--acid));
  display:flex; flex-direction:column; padding: 10px 12px; gap: 12px; }

.lfo-ghost{ position:absolute; right:-6px; bottom:-20px; font-family:var(--dinc);
  font-weight:700; font-size:100px; line-height:1; color:rgba(255,255,255,.03);
  pointer-events:none; z-index:0; }

/* Row 1: Header / Target / Output Viz */
.lfo-card-row-1 { display: flex; align-items: center; gap: 10px; position:relative; z-index:1; }
.lfo-run{ font-family:var(--mono); font-size:11px; min-height:44px; padding:0 12px;
  background:transparent; border:1px solid var(--line-2); color:var(--mute-2); letter-spacing:.08em; cursor:pointer;}
.lfo-run.on{ background:var(--shock); border-color:var(--shock); color:#fff; }
.lfo-id{ font-family:var(--din); font-weight:700; font-size:15px; letter-spacing:.05em;
  color:var(--lfo-accent,var(--acid)); }
  
.lfo-target-sel{
  flex:1; max-width: 140px; min-height:44px; padding:0 24px 0 10px;
  border:1px solid var(--line-2); background-color:#070708;
  background-image:
    linear-gradient(45deg, transparent 50%, var(--mute-2) 50%),
    linear-gradient(135deg, var(--mute-2) 50%, transparent 50%);
  background-position:calc(100% - 12px) calc(50% + 1px), calc(100% - 7px) calc(50% + 1px);
  background-size:5px 5px, 5px 5px;
  background-repeat:no-repeat;
  appearance:none; -webkit-appearance:none;
  font-family:var(--din); font-weight:700; font-size:13px; letter-spacing:.03em;
  text-transform:uppercase; color:var(--paper); cursor:pointer;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* Compact Output Viz in Row 1 */
.lfo-viz-header { display: flex; flex-direction: column; flex: 1.2; justify-content: center; height: 44px; padding: 0 4px; }
.lfo-viz-labels { display: flex; justify-content: space-between; margin-bottom: 5px; }
.lfo-viz-labels .k { font-family:var(--mono); font-size:9px; color:var(--mute-2); letter-spacing:.07em; text-transform:uppercase; }
.lfo-viz-labels .v { font-family:var(--mono); font-size:9px; color:var(--paper); letter-spacing:.05em; }

.lfo-bipolar-track {
  position: relative; height: 10px; background: rgba(0,0,0,0.5); border: 1px solid var(--line-2);
  border-radius: 5px; overflow: hidden; box-shadow: inset 0 1px 3px rgba(0,0,0,0.8);
}
.lfo-bipolar-center {
  position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: rgba(233,227,214,.3); z-index: 2;
}
.lfo-bipolar-fill {
  position: absolute; top: 0; bottom: 0; background: var(--shock); opacity: 0.6; z-index: 1;
}
/* Positive goes right from center */
.lfo-bipolar-fill.pos { left: 50%; width: 35%; }
/* Negative goes left from center */
.lfo-bipolar-fill.neg { right: 50%; width: 20%; background: var(--acid); }

.lfo-bipolar-cursor {
  position: absolute; top: -1px; bottom: -1px; width: 3px; background: #fff; z-index: 3;
  box-shadow: 0 0 6px rgba(255,255,255,0.8); border-radius: 2px;
}
.lfo-bipolar-cursor.pos { left: 85%; }
.lfo-bipolar-cursor.neg { left: 30%; }


/* Row 2: Controls */
.lfo-card-row-2 { display: grid; grid-template-columns: 1fr 2fr; gap: 16px; position:relative; z-index:1;}
.lfo-ctrl-col { display: flex; flex-direction: column; gap: 6px; }

/* Shape stacked above Sync */
.lfo-ctrl-header { display: flex; justify-content: space-between; align-items: center; min-height: 20px;}
.lfo-ctrl-header .k { font-family:var(--mono); font-size:10px; color:var(--mute-2);
  letter-spacing:.07em; text-transform:uppercase; }
.lfo-ctrl-header .v { color: var(--shock); font-family: var(--dinc); font-size: 16px; line-height: 1; letter-spacing: 0.05em; }

.lfo-shape {
  min-height:44px; padding:0 10px;
  border:1px solid var(--line-2); background-color:#070708;
  appearance:none; -webkit-appearance:none;
  font-family:var(--din); font-weight:700; font-size:13px; letter-spacing:.03em;
  text-transform:uppercase; color:var(--paper); cursor:pointer;
}

/* Big touch-friendly Sync Toggle */
.lfo-sync-toggle {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px;
  font-family: var(--din); font-size: 12px; text-transform: uppercase;
  color: var(--paper-2); background: rgba(0,0,0,0.3); border: 1px solid var(--line-2);
  cursor: pointer; letter-spacing: 0.05em;
}
.lfo-sync-toggle input { margin: 0; width: 14px; height: 14px; accent-color: var(--shock); }
.lfo-sync-toggle.active { color: var(--shock); border-color: rgba(255, 111, 36, 0.4); background: rgba(255, 111, 36, 0.1); }


/* Sliders group */
.lfo-sliders-group { display: flex; flex-direction: column; gap: 16px; }
.lfo-slider-row { display: flex; flex-direction: column; gap: 6px; }

.lfo-range{ height:44px; width: 100%; border:none; background:transparent; margin: 0; cursor:pointer;}
.lfo-range::-webkit-slider-runnable-track{ height:12px; background:#070708; border:1px solid var(--line); border-radius: 6px; }
.lfo-range::-webkit-slider-thumb{ -webkit-appearance:none; appearance:none; width: 16px; height: 28px; background: var(--paper); margin-top: -9px; border-radius: 3px; border: 1px solid var(--paper-ink);}
.lfo-range.lfo-depth::-webkit-slider-thumb{ background: var(--shock); border-color: #000; }

/* Animation for comp */
@keyframes lfo1 { 0% { left: 50%; width: 0%; } 50% { left: 50%; width: 35%; } 100% { left: 50%; width: 0%; } }
@keyframes cursor1 { 0% { left: 50%; } 50% { left: 85%; } 100% { left: 50%; } }

.anim-fill-1 { animation: lfo1 2s infinite ease-in-out; transform-origin: left center; }
.anim-cursor-1 { animation: cursor1 2s infinite ease-in-out; }

</style>
</head>
<body>

  <div class="modbar">
    <span class="modbar-title">Proposed LFO Design · <b>Easier Navigation & Clearer Viz</b></span>
    <span class="modbar-meta">The gauge is now inline with the routing block, packing the card even tighter.</span>
  </div>

  <div class="lfo-card-grid">
    
    <!-- LFO 1: Free Rate Example -->
    <div class="lfo-card" style="--lfo-accent: var(--acid);">
      <span class="lfo-ghost">01</span>
      
      <!-- Row 1: Target and Output Viz inline -->
      <div class="lfo-card-row-1">
        <button class="lfo-run on">ON</button>
        <span class="lfo-id">01</span>
        <select class="lfo-target-sel">
          <option>Pulsaret Size</option>
        </select>
        
        <div class="lfo-viz-header">
          <div class="lfo-viz-labels">
            <span class="k">Out</span>
            <span class="v">+0.70</span>
          </div>
          <div class="lfo-bipolar-track">
            <div class="lfo-bipolar-center"></div>
            <div class="lfo-bipolar-fill pos anim-fill-1"></div>
            <div class="lfo-bipolar-cursor pos anim-cursor-1"></div>
          </div>
        </div>
      </div>

      <!-- Row 2: Controls Grid (Left: Config, Right: Sliders) -->
      <div class="lfo-card-row-2">
        
        <div class="lfo-ctrl-col">
          <div class="lfo-slider-row">
            <div class="lfo-ctrl-header"><span class="k">SHAPE</span></div>
            <select class="lfo-shape"><option>Sine</option></select>
          </div>
          <div class="lfo-slider-row" style="margin-top: 8px;">
             <div class="lfo-ctrl-header"><span class="k">CLOCK</span></div>
             <label class="lfo-sync-toggle"><input type="checkbox"> MIDI SYNC</label>
          </div>
        </div>

        <div class="lfo-sliders-group">
          <div class="lfo-slider-row">
            <div class="lfo-ctrl-header">
              <span class="k">RATE</span>
              <span class="v">1.20 Hz</span>
            </div>
            <input type="range" class="lfo-range" value="40">
          </div>
          <div class="lfo-slider-row">
            <div class="lfo-ctrl-header">
              <span class="k">DEPTH</span>
              <span class="v">+70%</span>
            </div>
            <input type="range" class="lfo-range lfo-depth" value="85">
          </div>
        </div>

      </div>
    </div>

    <!-- LFO 2: MIDI Sync Example -->
    <div class="lfo-card" style="--lfo-accent: var(--ok);">
      <span class="lfo-ghost">02</span>
      
      <div class="lfo-card-row-1">
        <button class="lfo-run on">ON</button>
        <span class="lfo-id">02</span>
        <select class="lfo-target-sel">
          <option>Formant 1</option>
        </select>
        
        <div class="lfo-viz-header">
          <div class="lfo-viz-labels">
            <span class="k">Out (Inv)</span>
            <span class="v">-0.40</span>
          </div>
          <div class="lfo-bipolar-track">
            <div class="lfo-bipolar-center"></div>
            <div class="lfo-bipolar-fill neg" style="width: 20%; right: 50%; left: auto;"></div>
            <div class="lfo-bipolar-cursor neg" style="left: 30%;"></div>
          </div>
        </div>
      </div>

      <div class="lfo-card-row-2">
        <div class="lfo-ctrl-col">
          <div class="lfo-slider-row">
            <div class="lfo-ctrl-header"><span class="k">SHAPE</span></div>
            <select class="lfo-shape"><option>Saw</option></select>
          </div>
          <div class="lfo-slider-row" style="margin-top: 8px;">
             <div class="lfo-ctrl-header"><span class="k">CLOCK</span></div>
             <label class="lfo-sync-toggle active"><input type="checkbox" checked> MIDI SYNC</label>
          </div>
        </div>

        <div class="lfo-sliders-group">
          <div class="lfo-slider-row">
            <div class="lfo-ctrl-header">
              <span class="k">RATIO</span>
              <span class="v">1/4</span>
            </div>
            <input type="range" class="lfo-range" value="60">
          </div>
          <div class="lfo-slider-row">
            <div class="lfo-ctrl-header">
              <span class="k">DEPTH</span>
              <span class="v">-40%</span>
            </div>
            <input type="range" class="lfo-range lfo-depth" value="30">
          </div>
        </div>
      </div>
    </div>

    <!-- LFO 3: Off Example -->
    <div class="lfo-card" style="--lfo-accent: var(--warn); opacity: 0.7;">
      <span class="lfo-ghost">03</span>
      
      <div class="lfo-card-row-1">
        <button class="lfo-run">OFF</button>
        <span class="lfo-id">03</span>
        <select class="lfo-target-sel">
          <option>None</option>
        </select>
        
        <div class="lfo-viz-header">
          <div class="lfo-viz-labels">
            <span class="k">Out</span>
            <span class="v">0.00</span>
          </div>
          <div class="lfo-bipolar-track">
            <div class="lfo-bipolar-center"></div>
            <div class="lfo-bipolar-cursor" style="left: 50%;"></div>
          </div>
        </div>
      </div>

      <div class="lfo-card-row-2">
        <div class="lfo-ctrl-col">
          <div class="lfo-slider-row">
            <div class="lfo-ctrl-header"><span class="k">SHAPE</span></div>
            <select class="lfo-shape"><option>Square</option></select>
          </div>
          <div class="lfo-slider-row" style="margin-top: 8px;">
             <div class="lfo-ctrl-header"><span class="k">CLOCK</span></div>
             <label class="lfo-sync-toggle"><input type="checkbox"> MIDI SYNC</label>
          </div>
        </div>

        <div class="lfo-sliders-group">
          <div class="lfo-slider-row">
            <div class="lfo-ctrl-header">
              <span class="k">RATE</span>
              <span class="v">0.50 Hz</span>
            </div>
            <input type="range" class="lfo-range" value="20">
          </div>
          <div class="lfo-slider-row">
            <div class="lfo-ctrl-header">
              <span class="k">DEPTH</span>
              <span class="v">0%</span>
            </div>
            <input type="range" class="lfo-range lfo-depth" value="50">
          </div>
        </div>
      </div>

    </div>

  </div>
</body>
</html>
