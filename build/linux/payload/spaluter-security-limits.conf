# Spaluter: installed to /etc/security/limits.d/50-spaluter.conf by the .deb postinst.
#
# PipeWire's module-rt only takes the plain sched_setscheduler() path (SCHED_FIFO at
# rt.prio, nice -11) when the process may raise its nice level; with RLIMIT_NICE 0 it
# silently falls back to RTKit or runs the data loop as an ordinary thread, which on
# this device is then starved by scsynth's FIFO threads on CPU 3 (measured: 1670
# xruns in 4 h). The user manager (user@.service) opens a PAM session through
# /usr/lib/pam.d/systemd-user, whose pam_limits resets RLIMIT_NICE to 0 unless a
# limits entry grants it, overriding LimitNICE= in the user@.service drop-in. The
# kiosk user is in the audio group (audio.conf already grants rtprio 95 this way).
@audio   -  nice   -11
