# Spaluter Desktop: resource limits for the systemd user manager
# (user@.service) on the Raspberry Pi build. Installed by the .deb postinst to
# /etc/systemd/system/user@.service.d/50-spaluter.conf (Pi/ARM installs only).
#
# PipeWire runs as user services under this manager and inherits its limits.
# module-rt uses plain sched_setscheduler (SCHED_FIFO at rt.prio 88 from
# pipewire.conf) only when it can also set nice -11 itself; with the stock
# nice limit of 0 it falls back to RTKit, which caps PipeWire's audio data
# loop at SCHED_RR 20, below scsynth's own SCHED_FIFO 83 audio thread.
#
# A running session keeps its old limits until the next login, so the postinst
# also raises them in place with prlimit; PipeWire picks them up at its next
# start (systemctl --user restart pipewire wireplumber, or a reboot).
[Service]
LimitRTPRIO=95
LimitNICE=-11
