# Spaluter Desktop: PipeWire graph settings for the Raspberry Pi / pisound
# build. Installed by the .deb postinst to
# /etc/pipewire/pipewire.conf.d/50-spaluter.conf (Pi/ARM installs only).
#
# Takes effect after `systemctl --user restart pipewire wireplumber` or a
# reboot. Check the live value with:  pw-metadata -n settings 0 | grep quantum
#
# scsynth here is the Debian JACK-only build running as a pipewire-jack
# client, so this is the only place its period size is decided. 512 frames at
# 48 kHz is 10.7 ms per period, about 21 ms of output latency (the stock
# default of 1024 is 21.3 ms per period, roughly 43 ms).
#
# Measured 2026-11-14 on the Pi 4 / Patchbox (kernel 6.12 PREEMPT, not
# PREEMPT_RT) with the synth running at ~38% of a core: 256 produced 2 xruns
# per minute even with the UI idle; 512 produced none in 90 s with the UI
# live. Try 256 again after the synth graph has been slimmed down or on a
# PREEMPT_RT kernel, and judge it with `spaluter-measure` (the ERR column must
# stay flat across a real play session).
context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 48000 ]
    default.clock.quantum       = 512
    default.clock.min-quantum   = 512
    default.clock.max-quantum   = 1024

    # PipeWire's own real-time data loop (the thread that drives the pisound
    # ALSA node and wakes scsynth every period) runs on CPU 3 together with
    # scsynth's audio thread, off the cores Electron and Xorg use (0-2). Its
    # scheduling class comes from module-rt (rt.prio 88 in pipewire.conf) and
    # only becomes SCHED_FIFO when the user manager grants the nice and rtprio
    # limits; see spaluter-user-limits.conf next to this file.
    # Measured 2026-11-21 (5 min of play with touch, screen on, quantum 512):
    # 0 xruns, against 8 in the same scenario on 2026-11-15 without the pin.
    thread.affinity = [ 3 ]
}
